name: NTM validation
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B scripts/validate_release.py
      - run: python -B scripts/check_workflows.py
      - run: python -B scripts/browser_smoke.py
      - run: python -B scripts/quality_browser.py --output /tmp/ntm-performance.json
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: /tmp/ntm-performance.json
