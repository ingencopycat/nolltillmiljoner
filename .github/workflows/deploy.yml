name: Deploy and Update NTM Website
on:
  push:
    branches: [main]
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Update now: SEC issuer (ALL runs enrolled issuers)'
        type: choice
        default: ALL
        options: [ALL, NVDA, SOFI, CRWD]
concurrency:
  group: pages-and-macro
  cancel-in-progress: false
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B scripts/issuer_registry.py --check
      - run: python -m unittest discover -s tests -p "test_*.py"
        if: github.event_name == 'push'
      - run: node scripts/check_calendar_coverage.cjs
        if: github.event_name == 'push'
  prepare-data:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update macro data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python scripts/update_macro.py
          python tests/test_macro.py
          node scripts/preserve_macro_noop.cjs
      - name: Validate weekly publication after update
        run: node scripts/check_weekly_events.cjs
      - name: Incremental SEC update (scheduled and Update now)
        id: sec
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SEC_TICKER: ${{ inputs.ticker || 'ALL' }}
        run: |
          if [ "$SEC_TICKER" = ALL ]; then
            python -B scripts/update_stocks.py --daily --all
          else
            python -B scripts/update_stocks.py --daily --ticker "$SEC_TICKER"
          fi
      - name: Owner SEC review and run summary
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python -c "import json,os; p=json.load(open('artifacts/sec-refresh.json')); s={k:v for k,v in p.items() if k!='issuers'}; open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('## SEC refresh\n\n'+json.dumps(s,indent=2)+'\n\nSee sec-owner-review artifact for bounded source links and reasons.\n')"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: sec-owner-review
          path: artifacts/sec-refresh.json
          retention-days: 14
          if-no-files-found: error
      - name: Validate complete offline evidence candidate before transfer
        run: python -B scripts/evidence_sources.py --daily-report artifacts/sec-refresh.json
      - uses: actions/upload-artifact@v4
        with:
          name: validated-data
          retention-days: 1
          path: |
            data/weekly-events.js
            data/stocks/NVDA.json
            data/stocks/SOFI.json
            data/stocks/CRWD.json
            data/stocks/evidence/*.json
            scripts/source_reviews/*.json
            tests/fixtures/company_insiders/**
            tests/fixtures/company_evidence/**
            tests/fixtures/company_observations/**
            tests/fixtures/company_ownership/**
            tests/fixtures/company_material_events/**
          if-no-files-found: error
  commit-data:
    needs: prepare-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transferred candidate before any data commit
        run: |
          pip install -r requirements-browser.txt
          python -B scripts/validate_release.py
      - id: commit
        shell: bash
        run: |
          git add data/weekly-events.js data/stocks/NVDA.json data/stocks/SOFI.json data/stocks/CRWD.json data/stocks/evidence/*.json scripts/source_reviews/*.json tests/fixtures/company_insiders tests/fixtures/company_evidence tests/fixtures/company_observations tests/fixtures/company_ownership tests/fixtures/company_material_events
          python -B scripts/evidence_sources.py --staged
          if ! git diff --cached --quiet -- data; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): update validated data [skip ci]"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: commit-data
    if: github.event_name == 'push' || needs.commit-data.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit-data.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require intended production account configuration
        if: vars.NTM_CLOUD_ENABLED != 'true'
        run: |
          echo "Production account release requires NTM_CLOUD_ENABLED=true and the public Supabase variables."
          exit 1
      - name: Install isolated release-test dependencies
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/ntm-pglite" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          echo "PGLITE_MODULE=$RUNNER_TEMP/ntm-pglite/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Validate the exact revision before publishing
        env:
          BROWSER_CHANNEL: ''
        run: |
          python -B scripts/validate_release.py
          node scripts/test_social_rls.cjs
          python -B scripts/browser_smoke.py
          python -B scripts/test_social_browser.py
          python -B scripts/wave5_browser.py
          python -B scripts/test_auth_browser.py
          python -B scripts/quality_browser.py --output "$RUNNER_TEMP/ntm-release-quality.json"
          python -B scripts/check_workflows.py
      - run: |
          python scripts/stage_site.py _site
          python -c "import sys;sys.path.insert(0,'scripts');from stage_site import find_missing_local_references;missing=find_missing_local_references('_site');assert not missing,missing"
      - name: Generate optional public cloud configuration
        if: vars.NTM_CLOUD_ENABLED == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure_cloud.cjs --site _site
      - run: node scripts/check_cloud_security.cjs --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
